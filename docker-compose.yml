services:
  postgres:
    image: postgres:18
    container_name: tfidf-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tfidf
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: